<div class="field{% if campo.errors %} field--error{% endif %}">
  {% if campo.widget_type == 'checkbox' %}
  <label class="check" for="{{ campo.id_for_label }}">{{ campo }} <span>{{ campo.label }}</span></label>
  {% else %}
  <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
  {{ campo }}
  {% endif %}
  {% if campo.help_text %}<p class="help">{{ campo.help_text|safe }}</p>{% endif %}
  {% for e in campo.errors %}<p class="error-text">{{ e }}</p>{% endfor %}
</div>
