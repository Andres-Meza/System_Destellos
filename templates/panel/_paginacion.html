{% if page_obj.has_other_pages %}
<nav class="pager" aria-label="Paginación">
  {% if page_obj.has_previous %}
  <a class="btn btn--ghost btn--sm" href="?{% if q %}q={{ q|urlencode }}&amp;{% endif %}{% if estado %}estado={{ estado|urlencode }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Anterior</a>
  {% endif %}
  <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
  <a class="btn btn--ghost btn--sm" href="?{% if q %}q={{ q|urlencode }}&amp;{% endif %}{% if estado %}estado={{ estado|urlencode }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Siguiente</a>
  {% endif %}
</nav>
{% endif %}
